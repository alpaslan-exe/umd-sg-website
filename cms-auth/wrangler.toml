name = "umdsg-cms-auth"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Created by `npm run setup` (wrangler kv namespace create OTP_KV); paste the id here.
[[kv_namespaces]]
binding = "OTP_KV"
id = "3a0357e2568247f8a212f495760a87a6"

[vars]
# --- Cloudflare Access mode (preferred). Leave both empty to fall back to emailed codes via Brevo.
# Team domain from Zero Trust → Settings → Custom Pages (e.g. umdsg.cloudflareaccess.com)
ACCESS_TEAM_DOMAIN = "steep-mountain-0d4e.cloudflareaccess.com"
# Application Audience (AUD) tag: Zero Trust → Access → Applications → this app → Configure → Additional settings
ACCESS_AUD = "86cbca43ffac6e96336cc7105dd46e9528d34721d58db90384c063e8721406f7"
# Extra guard: only these emails (comma-separated) may sign in, even if the Access policy is wider.
ALLOWED_EMAILS = "dearbornsg.board@umich.edu"
# Hostnames allowed to use this authenticator (comma-separated, * wildcard ok).
ALLOWED_DOMAINS = "alpaslan-exe.github.io"
# Where one-time codes are delivered. This is a shared board mailing list by design.
MAIL_TO = "dearbornsg.board@umich.edu"
# Verified sender in Brevo (must match the verified address exactly, lowercase).
# umich greylists first contact from Brevo ("451 Tempfailed: denied by local policy"); delivery can lag a few minutes.
MAIL_FROM = "dearbornsg.board@umich.edu"
MAIL_FROM_NAME = "UM-Dearborn Student Government website"
SITE_NAME = "UM-Dearborn Student Government"
# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   BREVO_API_KEY   Brevo (free tier) transactional email API key
#   GITHUB_TOKEN    fine-grained PAT of the bot account, scoped to the site repo, Contents: read/write
