name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild daily at 10:00 UTC (06:00 Detroit) so the calendar list stays fresh.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve site URL and base path
        # Project page by default. To use an org page or custom domain, set
        # repository variables SITE_URL and BASE_PATH (BASE_PATH "/" for root).
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          BASE_PATH_VAR: ${{ vars.BASE_PATH }}
        run: |
          echo "SITE_URL=${SITE_URL_VAR:-https://${GITHUB_REPOSITORY_OWNER}.github.io}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${BASE_PATH_VAR:-/${GITHUB_REPOSITORY#*/}}" >> "$GITHUB_ENV"
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
